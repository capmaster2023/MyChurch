name: Build Siloé Mix

# Siloé Mix : télécommande des consoles PreSonus StudioLive (logiciel séparé de Siloé Stream, dossier mixeur/).
# « main » publie la version mix-v<mixeur/VERSION> ; « mix-dev » vérifie seulement la compilation.
on:
  push:
    branches: [main, mix-dev]
    paths: ['mixeur/**', '.github/workflows/mixeur.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK Siloé Mix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore de production (si les secrets existent)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compilation de l'APK
        working-directory: mixeur
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME=$(tr -d '[:space:]' < VERSION)
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../mixeur.log
          mkdir -p ../apk
          cp app/build/outputs/apk/release/app-release.apk ../apk/SiloeMix.apk

      - name: Erreurs de compilation
        if: failure()
        run: |
          grep -E "^e: " mixeur.log | sed -E 's#^e: file://[^ ]*/(mixeur/[^:]*):([0-9]+):([0-9]+) (.*)$#::error file=\1,line=\2,col=\3::\4#' || true

      - uses: actions/upload-artifact@v4
        with:
          name: SiloeMix
          path: apk/SiloeMix.apk

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d '[:space:]' < mixeur/VERSION)
          TAG="mix-v$V"
          if [ -f "mixeur/NOTES-$V.md" ]; then NOTES=(--notes-file "mixeur/NOTES-$V.md"); else NOTES=(--notes "Siloé Mix $V"); fi
          # jamais « latest » : la mise à jour de Siloé Stream lit la dernière version du dépôt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/SiloeMix.apk --clobber
            gh release edit "$TAG" --title "Siloé Mix $V" "${NOTES[@]}" --latest=false
          else
            gh release create "$TAG" apk/SiloeMix.apk --target "$GITHUB_SHA" --title "Siloé Mix $V" "${NOTES[@]}" --latest=false
          fi
